version: 1

applications:
  - appRoot: frontend

    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - rm -rf node_modules
            - npm ci --include=optional
            - npm install --no-save --package-lock=false @rolldown/binding-linux-x64-gnu@1.2.11

        build:
          commands:
            - npm run build

      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
